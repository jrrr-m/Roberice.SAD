<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products & Pricing - Roberice POS & Inventory System</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="app-container">
    <main class="main-wrapper">
      <div class="page-container">
        

        <div class="card">
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Rice Variety</th>
                  <th>Origin</th>
                  <th>Rice Type</th>
                  <th>Sack Price</th>
                  <th>Tinatakal (Kg)</th>
                  <th>5kg Pack</th>
                  <th>10kg Pack</th>
                  <th>20kg Pack</th>
                  <th>Current Stock</th>
                  <th>Low-Stock Alert</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="productsTableBody">
                <!-- Rendered via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Add/Edit Product Modal -->
  <div class="modal-overlay" id="modalProductForm">
    <div class="modal-card" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="productModalTitle">Add New Rice Variety</h3>
        <button class="modal-close" onclick="closeModal('modalProductForm')">&times;</button>
      </div>
      <form id="productForm">
        <input type="hidden" id="prodEditId" value="">
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label for="prodName">Rice Variety Name</label>
              <input type="text" id="prodName" class="form-control" placeholder="e.g. Sinandomeng Special" required>
            </div>
            <div class="form-group">
              <label for="prodOrigin">Origin</label>
              <select id="prodOrigin" class="form-select" required>
                <option value="Local">Local (Philippine Rice)</option>
                <option value="Imported">Imported (Imported Grain)</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prodRiceType">Specific Rice Type / Grain</label>
              <input type="text" id="prodRiceType" class="form-control" placeholder="e.g. Sinandomeng, Dinorado, Jasmine" required>
            </div>
            <div class="form-group">
              <label for="prodCategory">Category Classification</label>
              <input type="text" id="prodCategory" class="form-control" placeholder="e.g. Premium White, Aromatic, Regular Milled" required>
            </div>
          </div>

          <div class="form-row" style="grid-template-columns: repeat(3, 1fr);">
            <div class="form-group">
              <label for="prodPriceSack">Whole Sack Price (50kg) (₱)</label>
              <input type="number" id="prodPriceSack" class="form-control" placeholder="0.00" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label for="prodPrice25kg">Half Sack Price (25kg) (₱)</label>
              <input type="number" id="prodPrice25kg" class="form-control" placeholder="Auto / Half sack" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label for="prodPriceKg">Price per Kg / Loose (₱)</label>
              <input type="number" id="prodPriceKg" class="form-control" placeholder="0.00" step="0.01" min="0" required>
            </div>
          </div>

          <div class="form-row" style="grid-template-columns: repeat(3, 1fr);">
            <div class="form-group">
              <label for="prodPrice20kg">20kg Pack Price (₱)</label>
              <input type="number" id="prodPrice20kg" class="form-control" placeholder="Optional / Auto" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label for="prodPrice10kg">10kg Pack Price (₱)</label>
              <input type="number" id="prodPrice10kg" class="form-control" placeholder="Optional / Auto" step="0.01" min="0">
            </div>
            <div class="form-group">
              <label for="prodPrice5kg">5kg Pack Price (₱)</label>
              <input type="number" id="prodPrice5kg" class="form-control" placeholder="Optional / Auto" step="0.01" min="0">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="prodKgPerSack">Standard Kg per Whole Sack</label>
              <input type="number" id="prodKgPerSack" class="form-control" value="50" min="1" required readonly>
            </div>
            <div class="form-group">
              <label for="prodThresholdKg">Low-Stock Alert Threshold (Total Kg)</label>
              <input type="number" id="prodThresholdKg" class="form-control" value="200" min="1" required>
            </div>
          </div>

          <div id="initialStockRow">
            <div style="margin: 8px 0 4px; font-weight:600; font-size:12px; color:var(--text-muted); text-transform:uppercase;">
              Initial Inventory Stock Quantities
            </div>
            <div class="form-row" style="grid-template-columns: repeat(3, 1fr);">
              <div class="form-group">
                <label for="prodInitialSacks">Initial Whole Sacks (50Kg)</label>
                <input type="number" id="prodInitialSacks" class="form-control" value="10" min="0">
              </div>
              <div class="form-group">
                <label for="prodInitial25kg">Initial Half Sacks (25Kg)</label>
                <input type="number" id="prodInitial25kg" class="form-control" value="0" min="0">
              </div>
              <div class="form-group">
                <label for="prodInitialKg">Initial Loose Kg</label>
                <input type="number" id="prodInitialKg" class="form-control" value="0" min="0" step="0.1">
              </div>
            </div>
            <div class="form-row" style="grid-template-columns: repeat(3, 1fr);">
              <div class="form-group">
                <label for="prodInitial20kg">Initial 20kg Packs</label>
                <input type="number" id="prodInitial20kg" class="form-control" value="0" min="0">
              </div>
              <div class="form-group">
                <label for="prodInitial10kg">Initial 10kg Packs</label>
                <input type="number" id="prodInitial10kg" class="form-control" value="0" min="0">
              </div>
              <div class="form-group">
                <label for="prodInitial5kg">Initial 5kg Packs</label>
                <input type="number" id="prodInitial5kg" class="form-control" value="0" min="0">
              </div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" onclick="closeModal('modalProductForm')">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/products.js?v=2"></script>
</body>
</html>
