<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Roberice POS & Inventory System</title>
  <link rel="stylesheet" href="../css/styles.css?v=2">
</head>
<body>

  <div class="app-container">
    <main class="main-wrapper">
      <div class="page-container">
        
        <!-- 4 Metric Cards Row -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Total Varieties</span>
              <span class="stat-value" id="statTotalProducts">0</span>
              <span class="stat-subtext">Active Rice Items</span>
            </div>
            <div class="stat-icon-box blue">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Inventory Value</span>
              <span class="stat-value" id="statInventoryValue">₱0.00</span>
              <span class="stat-subtext">Estimated Wholesale</span>
            </div>
            <div class="stat-icon-box green">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Sales (7 Days)</span>
              <span class="stat-value" id="statSalesCount">0</span>
              <span class="stat-subtext" id="statSalesTotal">₱0.00 total</span>
            </div>
            <div class="stat-icon-box purple">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Low Stock Items</span>
              <span class="stat-value" id="statLowStockCount">0</span>
              <span class="stat-subtext">Needs Restocking</span>
            </div>
            <div class="stat-icon-box amber">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-info">
              <span class="stat-label">Old Stock Alert</span>
              <span class="stat-value" id="statOldStockCount" style="color:var(--danger);">0</span>
              <span class="stat-subtext">&gt; 60 Days Old (FIFO Action)</span>
            </div>
            <div class="stat-icon-box" style="background:#fee2e2;color:#dc2626;">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
          </div>
        </div>

        <!-- Charts Grid Row -->
        <div class="dashboard-grid">
          <div class="card">
            <div class="card-title">Sales Trend (Last 7 Days)</div>
            <div class="chart-container" id="chartSalesTrend"></div>
          </div>

          <div class="card">
            <div class="card-title">Product Categories / Variety Sales</div>
            <div class="chart-container" id="chartProductCategories"></div>
          </div>
        </div>

        <!-- Lists Grid Row -->
        <div class="dashboard-grid">
          <div class="card">
            <div class="card-title">
              <div class="card-title-left">
                <svg width="18" height="18" fill="none" stroke="currentColor" color="var(--success)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                Top Selling Products
              </div>
            </div>
            <div class="item-list" id="topSellingList">
              <!-- Rendered via JS -->
            </div>
          </div>

          <div class="card">
            <div class="card-title">
              <div class="card-title-left">
                <svg width="18" height="18" fill="none" stroke="currentColor" color="var(--warning)" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                Low Stock Alerts
              </div>
            </div>
            <div class="item-list" id="lowStockAlertList">
              <!-- Rendered via JS -->
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/charts.js?v=2"></script>
  <script src="../js/auth.js?v=3"></script>
  <script src="../js/dashboard.js"></script>
</body>
</html>
