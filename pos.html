<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Point of Sale - Roberice POS & Inventory System</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="app-container">
    <main class="main-wrapper">
      <div class="page-container">
        
        <div class="page-header">
          <div class="page-title">
            <h2>Point of Sale (POS)</h2>
            <p>Process customer rice transactions and automatically update inventory stock.</p>
          </div>
        </div>

        <!-- POS Two-Column Workspace Layout -->
        <div class="pos-layout">
          
          <!-- Left: Product Selection Panel -->
          <div class="pos-products-panel">
            <div class="pos-header-bar" style="flex-wrap:wrap; gap:8px;">
              <div class="search-box" style="flex:1; min-width:180px;">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <input type="text" id="searchProduct" class="form-control" placeholder="Search rice variety, origin, or type...">
              </div>
              <select id="filterOrigin" class="form-select" style="width: 130px;">
                <option value="all">All Origins</option>
                <option value="Local">Local</option>
                <option value="Imported">Imported</option>
              </select>
              <select id="filterCategory" class="form-select" style="width: 150px;">
                <option value="all">All Rice Types</option>
              </select>
            </div>

            <!-- Product Grid -->
            <div class="product-grid" id="productGrid">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Right: Cart & Checkout Panel -->
          <div class="pos-cart-panel">
            <div class="cart-header">
              <h3>Current Order</h3>
              <button class="btn btn-secondary btn-sm" id="btnClearCart">Clear Cart</button>
            </div>

            <!-- Cart Items List -->
            <div class="cart-items" id="cartItemsList">
              <!-- Rendered via JS -->
            </div>

            <!-- Cart Summary & Payment -->
            <div class="cart-summary">
              <div class="summary-row">
                <span>Subtotal</span>
                <span id="lblSubtotal">₱0.00</span>
              </div>
              
              <div class="summary-row total">
                <span>Total Amount</span>
                <span id="lblTotal" style="color: var(--primary);">₱0.00</span>
              </div>

              <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 4px 0;">

              <div class="form-group" style="margin-bottom: 8px;">
                <label>Payment Method</label>
                <select id="paymentMethod" class="form-select">
                  <option value="Cash">Cash</option>
                  <option value="GCash">GCash</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                </select>
              </div>

              <div class="form-group" style="margin-bottom: 8px;">
                <label>Amount Received (₱)</label>
                <input type="number" id="inputPaymentReceived" class="form-control" placeholder="0.00" step="0.01" min="0">
              </div>

              <div class="summary-row" style="font-weight: 700; color: var(--text-main); font-size: 15px;">
                <span>Change</span>
                <span id="lblChange">₱0.00</span>
              </div>

              <button class="btn btn-success btn-lg btn-block" id="btnCompleteSale" style="margin-top: 8px;" disabled>
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                Complete Sale
              </button>
            </div>
          </div>

        </div>

      </div>
    </main>
  </div>

  <!-- Printable Receipt Modal -->
  <div class="modal-overlay" id="modalReceipt">
    <div class="modal-card" style="max-width: 400px;">
      <div class="modal-header">
        <h3>Transaction Receipt</h3>
        <button class="modal-close" onclick="closeModal('modalReceipt')">&times;</button>
      </div>
      <div class="modal-body printable-area">
        <div class="receipt-box" id="receiptContent">
          <!-- Rendered via JS -->
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('modalReceipt')">Close</button>
        <button class="btn btn-primary" onclick="window.print()">Print Receipt</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/pos.js"></script>
</body>
</html>
