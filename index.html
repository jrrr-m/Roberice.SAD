<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roberice POS & Inventory System</title>
  <link rel="icon" type="image/png" href="assets/roberice-logo.png">
</head>
<body>
  <script>
    const userJson = sessionStorage.getItem('roberice_logged_user');
    if (userJson) {
      try {
        const user = JSON.parse(userJson);
        const role = (user.role || '').toLowerCase().trim();
        let perms = user.permissions;
        if (typeof perms === 'string') {
          try { perms = JSON.parse(perms); } catch (e) { perms = []; }
        }

        if (role === 'admin' || (Array.isArray(perms) && perms.includes('dashboard'))) {
          window.location.href = 'pages/dashboard.html?v=20261021_v5';
        } else if (Array.isArray(perms) && perms.length > 0) {
          const pageOrder = [
            'dashboard', 'pos', 'view-inventory', 'inventory', 'products',
            'transactions', 'sales-report', 'file-manager', 'audit', 'users'
          ];
          const firstAllowed = pageOrder.find(id => perms.includes(id)) || 'pos';
          window.location.href = 'pages/' + firstAllowed + '.html?v=20261021_v5';
        } else {
          window.location.href = 'pages/pos.html?v=20261021_v5';
        }
      } catch (e) {
        window.location.href = 'pages/login.html?v=20261021_v5';
      }
    } else {
      window.location.href = 'pages/login.html?v=20261021_v5';
    }
  </script>
</body>
</html>
